version: 2

project_name: ebpf-bridge

builds:
  - main: ./ebpf-bridge
    binary: ebpf-bridge
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/jklaiber/ebpf-bridge/ebpf-bridge/cmd.version={{ .Version }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]

checksum:
  name_template: checksums.txt

# SPDX SBOM for every archive (needs syft).
sboms:
  - artifacts: archive

# The release and its notes are created by release-please from CHANGELOG.md;
# GoReleaser only uploads the artifacts.
release:
  mode: keep-existing

changelog:
  disable: true

dockers_v2:
  - images:
      - ghcr.io/jklaiber/ebpf-bridge
    tags:
      - "{{ .Tag }}"
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    # Attach an SBOM attestation to the image.
    sbom: true
    dockerfile: build/package/Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.source: https://github.com/jklaiber/ebpf-bridge
      org.opencontainers.image.description: Linux bridges made simple with eBPF
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"

nfpms:
  - maintainer: Julian Klaiber <oss@klaibernet.ch>
    description: Linux bridges made simple with eBPF.
    homepage: https://github.com/jklaiber/ebpf-bridge
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    scripts:
      postinstall: ./build/package/after-install.sh
      preremove: ./build/package/before-remove.sh
    contents:
      - src: ./init/ebpf-bridge.service
        dst: /lib/systemd/system/ebpf-bridge.service
